name: python-release

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. python-v0.1.0)"
        required: true

permissions:
  contents: write        # required to create the release and upload assets

defaults:
  run:
    working-directory: python

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag and check it matches pyproject.toml
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG#python-v}"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_ENV"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "!! tag $TAG (version $TAG_VERSION) does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi

      - name: Install test + build tooling
        run: pip install ".[test]" build

      - name: Run golden test suite
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build

      # A tag must never publish artifacts that were not verified at runtime.
      # Install the built wheel into a clean venv (away from the local
      # source tree, so `import vpt` can't shadow-resolve to it) and re-run
      # the suite against the installed copy before anything is published.
      - name: Verify built wheel installs and passes tests
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl pytest pytest-cov
          cd tests
          /tmp/wheel-check/bin/python -m pytest -q

      - name: Checksums
        run: ( cd dist && sha256sum ./* > SHA256SUMS )

      - name: Assemble release notes
        run: |
          {
            echo "Python port release of \`vpt\`, from \`muratcanozdemir/Visual-Processing-Library\`."
            echo
            echo "A port of the VPT Java library (see the top-level \`v*\` tags/releases) to Python, verified against golden values dumped from the Java oracle. See \`python/README.md\` for port status and \`python/IMPROVEMENTS.md\` for the audit history."
            echo
            echo "### Verification"
            echo
            echo "Built and installed on Python 3.12. The full golden test suite passed both against the source tree and against a clean install of the built wheel."
            echo
            echo "### Artifacts"
            echo
            echo "| File | Contents |"
            echo "|---|---|"
            for f in dist/*.whl; do echo "| \`$(basename "$f")\` | built wheel |"; done
            for f in dist/*.tar.gz; do echo "| \`$(basename "$f")\` | source distribution |"; done
            echo "| \`SHA256SUMS\` | checksums |"
            echo
            echo "### Installing"
            echo
            echo '```sh'
            echo "pip install vpt-${tag_version}-py3-none-any.whl"
            echo '```'
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          body_path: python/release-notes.md
          files: |
            python/dist/*.whl
            python/dist/*.tar.gz
            python/dist/SHA256SUMS
          draft: false
          prerelease: ${{ contains(env.tag, '-rc') || contains(env.tag, '-alpha') || contains(env.tag, '-beta') || contains(env.tag, '.dev') }}
