name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]        # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the floor the source actually needs; 21 is what it was repaired on.
        java: ["17", "21"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Jama
        uses: actions/cache@v6
        with:
          path: lib/jama.jar
          key: jama-1.0.3

      - name: Fetch and verify Jama
        run: ./scripts/fetch-jama.sh

      - name: Compile
        run: ./build.sh

      # Compiling is not enough. BooleanImage compiled cleanly for three sessions
      # while throwing ClassCastException at runtime (a decompiler-mangled
      # ternary). Only executing the harnesses catches that class of damage.
      - name: Run verification harnesses
        run: ./scripts/run-tests.sh

      - name: Package jars
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: vpt-jars-java${{ matrix.java }}
          path: build-out/*.jar
          retention-days: 14

  # The Python suite (python-ci.yml) replays committed goldens so it can run
  # without a JDK. Nothing there checks those goldens still match the oracle:
  # a change to src/ or oracle/Dump*.java, or a hand-edited golden, would go
  # unnoticed. Regenerate them from the Java tree and fail on any difference.
  # JDK 21 only -- the goldens were generated with it.
  golden-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Jama
        uses: actions/cache@v6
        with:
          path: lib/jama.jar
          key: jama-1.0.3

      - name: Fetch and verify Jama
        run: ./scripts/fetch-jama.sh

      - name: Compile
        run: ./build.sh

      - name: Regenerate goldens from the oracle
        run: ./python/tests/regen-goldens.sh

      - name: Fail if committed goldens differ from the oracle
        run: |
          if ! git diff --exit-code --stat -- python/tests/goldens; then
            echo "::error::Committed goldens differ from the Java oracle's output."
            echo "If src/ or oracle/ changed on purpose, run python/tests/regen-goldens.sh,"
            echo "review the diff, and commit it. Never regenerate just to make a test pass."
            git diff -- python/tests/goldens | head -200
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- python/tests/goldens)" ]; then
            echo "::error::A Dump driver produced a golden that is not committed:"
            git status --porcelain --untracked-files=all -- python/tests/goldens
            exit 1
          fi
