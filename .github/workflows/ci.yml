name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]        # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the floor the source actually needs; 21 is what it was repaired on.
        java: ["17", "21"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Jama
        uses: actions/cache@v4
        with:
          path: lib/jama.jar
          key: jama-1.0.3

      - name: Fetch and verify Jama
        run: ./scripts/fetch-jama.sh

      - name: Compile
        run: ./build.sh

      # Compiling is not enough. BooleanImage compiled cleanly for three sessions
      # while throwing ClassCastException at runtime (a decompiler-mangled
      # ternary). Only executing the harnesses catches that class of damage.
      - name: Run verification harnesses
        run: ./scripts/run-tests.sh

      - name: Package jars
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vpt-jars-java${{ matrix.java }}
          path: build-out/*.jar
          retention-days: 14
