name: python-ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["python-v*"]   # releases are cut by release-please.yml
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-wheels.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-wheels.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # --locked: fail if uv.lock is out of date with pyproject.toml instead
      # of silently re-resolving.
      - name: Ruff check
        run: uv run --locked --only-group lint ruff check .

      # The Rust kernels (python/src, built as vpt._native).
      - name: Rust format and lints
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      # python/LICENSE is a copy of the repo-root LICENSE so it can ship in
      # the wheel/sdist (build backends won't read outside python/).
      - name: Bundled LICENSE matches the repo's
        run: cmp LICENSE ../LICENSE

      # Every wheel ships THIRD_PARTY_NOTICES (the licenses of the code
      # compiled into vpt._native); fail if a dependency change left it stale.
      - name: Third-party notices are current
        run: python3 scripts/third_party_notices.py --check

      # release-please owns the version: its release PRs bump pyproject.toml,
      # uv.lock's vpt entry and .release-please-manifest.json together. Fail
      # if a hand edit left them disagreeing.
      - name: Version is consistent across pyproject, uv.lock and the manifest
        run: |
          uv run --no-project python - <<'EOF'
          import json, sys, tomllib
          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          lock = next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"]
                      if p["name"] == "vpt")
          manifest = json.load(open("../.release-please-manifest.json"))["python"]
          print(f"pyproject.toml={pyproject} uv.lock={lock} manifest={manifest}")
          sys.exit(0 if pyproject == lock == manifest else "version mismatch")
          EOF

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor is 3.11; 3.14 is the current latest.
        python: ["3.11", "3.12", "3.13", "3.14"]
        impl: [native]
        include:
          # The pure-Python code is the reference the Rust kernels are
          # checked against, and the fallback where vpt._native isn't
          # built: keep it passing the goldens on its own.
          - python: "3.13"
            impl: pure

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv with Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # uv builds the package (and the Rust extension, with the runner's
      # preinstalled toolchain) before running.
      - name: Run golden test suite (${{ matrix.impl }})
        env:
          VPT_REQUIRE_NATIVE: ${{ matrix.impl == 'native' && '1' || '' }}
          VPT_PURE_PYTHON: ${{ matrix.impl == 'pure' && '1' || '' }}
        run: uv run --locked --group test pytest -q --cov=vpt --cov-report=term-missing

  # Platform wheels + sdist, each installed and re-tested (shared with
  # release-please.yml, which ships what this builds).
  dist:
    needs: [lint, test]
    uses: ./.github/workflows/python-wheels.yml
