[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpt"
version = "0.1.0.dev0"
description = "Visual Processing Library — Python port of the VPT Java library"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The port deliberately mirrors Java naming, so the pep8-naming rules that
# would flag getXYCDouble and friends are off by design.
ignore = ["N802", "N803", "N806", "N815", "N818"]
