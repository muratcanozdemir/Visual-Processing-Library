[build-system]
# >=77 for PEP 639: the SPDX `license` string and `license-files` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vpt"
version = "0.1.0"
description = "Visual Processing Library — Python port of the VPT Java library"
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression, not `{file = "../LICENSE"}`: setuptools refuses to read a
# license file located outside the project root (here, the repo root one
# level up), which broke every install -- editable or not -- of this package.
license = "MIT"
# A copy of the repo-root LICENSE, kept inside python/ so it can ship in the
# sdist and wheel (setuptools won't read files outside the project root).
license-files = ["LICENSE"]
authors = [{ name = "Murat Can Ozdemir" }]
keywords = [
    "image processing",
    "mathematical morphology",
    "computer vision",
    "segmentation",
    "texture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/muratcanozdemir/Visual-Processing-Library"
Issues = "https://github.com/muratcanozdemir/Visual-Processing-Library/issues"
Changelog = "https://github.com/muratcanozdemir/Visual-Processing-Library/releases"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4"]
lint = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["vpt*"]

[tool.setuptools.package-data]
# PEP 561 marker: tells type checkers to use the inline annotations.
vpt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["vpt"]

[tool.coverage.report]
# No --cov-fail-under is set (deliberately, not an oversight): the baseline
# is ~84% line coverage, but a meaningful chunk of the gap is legitimately
# hard to hit under this port's own rules -- defensive branches that are
# provably dead for any in-range input (the many `else: print("sorun var
# ...")` debug branches across the HSY conversion family, for instance),
# and error/exception paths. Picking a number without separating "real gap"
# from "structurally unreachable" would either fail the build on code that
# can't be tested, or be set low enough to be meaningless. Run
# `pytest --cov=vpt --cov-report=term-missing` to see the current report
# before deciding on a threshold, package-by-package rather than one
# repo-wide number.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's un-pinned default rule set pulls in far more than pycodestyle/pyflakes
# (bugbear, pyupgrade, simplify, pylint, ...) and floods a 1:1 Java port with
# stylistic findings it wasn't written against. Scope CI linting to real
# correctness signal: pyflakes (F) and pycodestyle errors (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
# The port deliberately mirrors Java naming, so the pep8-naming rules that
# would flag getXYCDouble and friends are off by design. (N isn't in `select`
# above, so these only matter if N is ever added back.) E741 (ambiguous
# single-letter names like `l`) is the same category -- the Java source uses
# `l` for label variables, and this port mirrors it.
ignore = ["N802", "N803", "N806", "N815", "N818", "N999", "E741"]
