[build-system]
# >=1.27 for PEP 639: the SPDX `license` string and `license-files` below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vpt"
# Managed by release-please (release-please-config.json at the repo root):
# its release PRs bump this, uv.lock's matching entry, and CHANGELOG.md
# together. Don't edit by hand.
version = "0.1.0"
description = "Visual Processing Library — Python port of the VPT Java library"
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression (PEP 639), not `{file = "../LICENSE"}`: build backends
# won't read a license file outside the project root (python/).
license = "MIT"
# A copy of the repo-root LICENSE, kept inside python/ so it ships in the
# sdist and wheel; python-ci fails if the two drift apart.
license-files = ["LICENSE"]
authors = [{ name = "Murat Can Ozdemir" }]
keywords = [
    "image processing",
    "mathematical morphology",
    "computer vision",
    "segmentation",
    "texture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/muratcanozdemir/Visual-Processing-Library"
Issues = "https://github.com/muratcanozdemir/Visual-Processing-Library/issues"
Changelog = "https://github.com/muratcanozdemir/Visual-Processing-Library/blob/main/python/CHANGELOG.md"

# Development-only tooling (PEP 735 dependency groups): not part of the
# published package's metadata, unlike the old `[test]`/`[lint]` extras.
# `uv sync` installs the `dev` group by default.
[dependency-groups]
test = ["pytest>=7", "pytest-cov>=4"]
lint = ["ruff>=0.6"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.hatch.build.targets.wheel]
# Everything under vpt/ ships, including the PEP 561 `py.typed` marker.
packages = ["vpt"]

[tool.hatch.build.targets.sdist]
# pyproject.toml, the readme and license-files are always included.
include = ["vpt", "tests", "CHANGELOG.md", "IMPROVEMENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["vpt"]

[tool.coverage.report]
# No --cov-fail-under is set (deliberately, not an oversight): the baseline
# is ~84% line coverage, but a meaningful chunk of the gap is legitimately
# hard to hit under this port's own rules -- defensive branches that are
# provably dead for any in-range input (the many `else: print("sorun var
# ...")` debug branches across the HSY conversion family, for instance),
# and error/exception paths. Picking a number without separating "real gap"
# from "structurally unreachable" would either fail the build on code that
# can't be tested, or be set low enough to be meaningless. Run
# `pytest --cov=vpt --cov-report=term-missing` to see the current report
# before deciding on a threshold, package-by-package rather than one
# repo-wide number.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's un-pinned default rule set pulls in far more than pycodestyle/pyflakes
# (bugbear, pyupgrade, simplify, pylint, ...) and floods a 1:1 Java port with
# stylistic findings it wasn't written against. Scope CI linting to real
# correctness signal: pyflakes (F) and pycodestyle errors (E4/E7/E9).
select = ["E4", "E7", "E9", "F"]
# The port deliberately mirrors Java naming, so the pep8-naming rules that
# would flag getXYCDouble and friends are off by design. (N isn't in `select`
# above, so these only matter if N is ever added back.) E741 (ambiguous
# single-letter names like `l`) is the same category -- the Java source uses
# `l` for label variables, and this port mirrors it.
ignore = ["N802", "N803", "N806", "N815", "N818", "N999", "E741"]
